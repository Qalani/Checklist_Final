name: CodeQL

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: java-kotlin
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK 21
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        if: matrix.language == 'java-kotlin'
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Install Android compile SDK
        if: matrix.language == 'java-kotlin'
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      # Kotlin needs a traced compilation. Keep these flags scan-specific so a
      # previous Gradle daemon, incremental output or build cache cannot hide it.
      - name: Compile Android for CodeQL
        if: matrix.language == 'java-kotlin'
        working-directory: android
        run: >-
          ./gradlew --no-daemon --no-build-cache --no-configuration-cache --rerun-tasks
          -Pkotlin.incremental=false -Pkotlin.compiler.execution.strategy=in-process
          clean :app:assembleDebug
      - name: Analyze and upload CodeQL results
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'
