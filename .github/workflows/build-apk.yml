name: Build Native Android APK

on:
  push:
    branches: [main, master, 'claude/**', 'codex/**']
    paths:
      - 'android/**'
      - 'scripts/verify-native-android.py'
      - '.github/workflows/build-apk.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'scripts/verify-native-android.py'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Native unit tests, lint and APK
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Install compile SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Verify native architecture
        run: python3 scripts/verify-native-android.py
      - name: Test, lint and build native APK
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug compileDebugAndroidTestKotlin assembleDebug
      - name: Verify native APK and signing certificate
        run: |
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          python3 scripts/verify-native-android.py "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk"
      - name: Inspect previous APK signing certificates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          temp="$(mktemp -d)"
          signer="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | sed -n '1,4p'
          for run in 41199299867 41201438521; do
            mkdir "$temp/$run"
            if gh run download "$run" --repo "$GITHUB_REPOSITORY" --name zen-workspace-native-debug-apk --dir "$temp/$run"; then
              echo "Published APK from build $run"
              "$signer" verify --print-certs "$temp/$run/app-debug.apk"
            else
              echo "Published APK from build $run could not be downloaded."
            fi
          done
      - name: Read visual check captures
        if: always()
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          for path in pathlib.Path('android/app/build/test-results/testDebugUnitTest').glob('*WorkspacePreviewCaptureTest.xml'):
              text = path.read_text()
              for capture in re.findall(r'ZEN_PREVIEW_[A-Z]+ [A-Za-z0-9+/=]+', text):
                  print(capture)
          PY
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zen-workspace-native-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload check reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-check-reports
          path: |
            android/app/build/reports/tests/
            android/app/build/reports/lint-results-debug.html
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
          if-no-files-found: ignore
