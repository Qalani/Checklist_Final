plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.gms.google-services'
}

def publicSetting = { String property, String nativeVariable, String webVariable ->
    providers.gradleProperty(property)
        .orElse(providers.environmentVariable(nativeVariable))
        .orElse(providers.environmentVariable(webVariable))
        .getOrElse('')
}
def supabaseUrl = publicSetting('supabaseUrl', 'SUPABASE_URL', 'NEXT_PUBLIC_SUPABASE_URL')
def supabaseKey = publicSetting('supabasePublishableKey', 'SUPABASE_PUBLISHABLE_KEY', 'NEXT_PUBLIC_SUPABASE_ANON_KEY')
def quoted = { String value -> groovy.json.JsonOutput.toJson(value) }
def isPrivilegedKey = { String value ->
    if (value.startsWith('sb_secret_')) return true
    try {
        def segments = value.split('\\.')
        if (segments.length != 3) return false
        def claims = new groovy.json.JsonSlurper().parseText(new String(Base64.urlDecoder.decode(segments[1]), 'UTF-8'))
        return claims.role == 'service_role'
    } catch (Exception ignored) {
        return false
    }
}
if (isPrivilegedKey(supabaseKey)) {
    throw new GradleException('A privileged Supabase key cannot be packaged in an Android app. Use a publishable or anon client key.')
}

android {
    namespace 'com.zenworkspace.app'
    compileSdk 36
    defaultConfig {
        applicationId 'com.zenworkspace.app'
        minSdk 24
        targetSdk 36
        versionCode 3
        versionName '2.1-native'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        buildConfigField 'String', 'SUPABASE_URL', quoted(supabaseUrl)
        buildConfigField 'String', 'SUPABASE_PUBLISHABLE_KEY', quoted(supabaseKey)
    }
    buildFeatures { compose true; buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
    kotlinOptions { jvmTarget = '17' }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    packaging { resources.excludes += ['/META-INF/{AL2.0,LGPL2.1}'] }
    testOptions {
        unitTests.returnDefaultValues = true
        unitTests.includeAndroidResources = true
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2025.05.01')
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.9.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.1'
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.browser:browser:1.8.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation platform('com.google.firebase:firebase-bom:33.14.0')
    implementation 'com.google.firebase:firebase-messaging'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'androidx.compose.ui:ui-test-junit4'
    testImplementation 'androidx.test:core:1.6.1'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'org.json:json:20250517'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.2'
    androidTestImplementation platform('androidx.compose:compose-bom:2025.05.01')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}

// Only public/publishable client keys belong in an Android binary.
tasks.register('validateReleaseConfiguration') {
    doLast {
        if (!supabaseUrl.startsWith('https://') || supabaseKey.isBlank()) {
            throw new GradleException('Release builds require supabaseUrl and supabasePublishableKey (or the documented environment variables).')
        }
    }
}
tasks.configureEach {
    if (name == 'preReleaseBuild') { dependsOn 'validateReleaseConfiguration' }
}

// Robolectric resolves its Android runtime inside the forked test JVM. Preserve
// an explicitly configured build proxy and trust store in managed environments.
tasks.withType(Test).configureEach {
    systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
    ['http.proxyHost', 'http.proxyPort', 'https.proxyHost', 'https.proxyPort',
     'http.nonProxyHosts', 'javax.net.ssl.trustStore', 'javax.net.ssl.trustStoreType'].each { key ->
        def value = System.getProperty(key)
        if (value != null) systemProperty key, value
    }
}
